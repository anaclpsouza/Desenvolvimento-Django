{% extends 'base.html' %}

{% block titulo %}Criar Categoria{% endblock %}

{% block cabecalho %}Cadastrar Categoria{% endblock %}

{% block conteudo %}
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" maxlength="100" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição:</label>
            <textarea id="descricao" name="descricao" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" id="ativa" name="ativa" class="form-check-input" checked>
            <label for="ativa" class="form-check-label">Ativa</label>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'eventos:lista_categorias' %}" class="btn btn-secondary">Voltar</a>
    </form>
{% endblock %}
