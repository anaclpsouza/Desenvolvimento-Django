{% extends 'base.html' %}

{% block titulo %}Atualizar Evento{% endblock %}

{% block cabecalho %}Atualizar Evento{% endblock %}

{% block conteudo %}
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="titulo" class="form-label">Título:</label>
            <input type="text" id="titulo" name="titulo" value="{{ evento.titulo }}" maxlength="150" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição:</label>
            <textarea id="descricao" name="descricao" class="form-control" rows="3" required>{{ evento.descricao }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="data_evento" class="form-label">Data:</label>
                <input type="date" id="data_evento" name="data_evento" value="{{ evento.data_evento|date:'Y-m-d' }}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="valor" class="form-label">Valor (R$):</label>
                <input type="number" step="0.01" id="valor" name="valor" value="{{ evento.valor }}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="vagas" class="form-label">Vagas:</label>
                <input type="number" id="vagas" name="vagas" value="{{ evento.vagas }}" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="categoria" class="form-label">Categoria:</label>
                <select id="categoria" name="categoria" class="form-select" required>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id == evento.categoria_id %}selected{% endif %}>{{ cat.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="organizador" class="form-label">Organizador:</label>
                <select id="organizador" name="organizador" class="form-select" required>
                    {% for org in organizadores %}
                        <option value="{{ org.id }}" {% if org.id == evento.organizador_id %}selected{% endif %}>{{ org.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label for="palestrantes" class="form-label">Palestrantes:</label>
            <select id="palestrantes" name="palestrantes" class="form-select" multiple>
                {% for pal in palestrantes %}
                    <option value="{{ pal.id }}" {% if pal.id in palestrantes_selecionados %}selected{% endif %}>
                        {{ pal.nome }} ({{ pal.especialidade }})
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" id="ativo" name="ativo" class="form-check-input" {% if evento.ativo %}checked{% endif %}>
            <label for="ativo" class="form-check-label">Ativo</label>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <a href="{% url 'eventos:lista_eventos' %}" class="btn btn-secondary">Voltar</a>
    </form>
{% endblock %}
