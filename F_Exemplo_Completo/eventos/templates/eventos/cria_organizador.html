{% extends 'base.html' %}

{% block titulo %}Criar Organizador{% endblock %}

{% block cabecalho %}Cadastrar Organizador{% endblock %}

{% block conteudo %}
    <form method="POST">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="codigo" class="form-label">Código:</label>
                <input type="text" id="codigo" name="codigo" maxlength="10" class="form-control" required>
            </div>
            <div class="col-md-8 mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" name="nome" maxlength="100" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text" id="telefone" name="telefone" maxlength="20" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label for="biografia" class="form-label">Biografia:</label>
            <textarea id="biografia" name="biografia" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="linkedin" class="form-label">LinkedIn:</label>
            <input type="text" id="linkedin" name="linkedin" maxlength="200" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'eventos:lista_organizadores' %}" class="btn btn-secondary">Voltar</a>
    </form>
{% endblock %}
