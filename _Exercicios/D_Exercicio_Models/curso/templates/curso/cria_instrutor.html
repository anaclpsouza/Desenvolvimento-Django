{% extends 'base.html' %}

{% block titulo %}Criar Instrutor{% endblock %}

{% block conteudo %}
    <h1 class="mb-3">Cadastrar Instrutor</h1>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="codigo" class="form-label">Código:</label>
            <input type="text" id="codigo" name="codigo" maxlength="10" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" maxlength="100" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="idade" class="form-label">Idade:</label>
            <input type="number" id="idade" name="idade" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="especialidade" class="form-label">Especialidade:</label>
            <input type="text" id="especialidade" name="especialidade" maxlength="100" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="curriculo" class="form-label">Currículo:</label>
            <textarea id="curriculo" name="curriculo" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="biografia" class="form-label">Biografia:</label>
            <textarea id="biografia" name="biografia" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="linkedin" class="form-label">LinkedIn:</label>
            <input type="text" id="linkedin" name="linkedin" maxlength="200" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'curso:principal' %}" class="btn btn-secondary">Voltar</a>
    </form>
{% endblock %}
