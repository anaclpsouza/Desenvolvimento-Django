{% extends 'base.html' %}

{% block titulo %}Detalhes da Área{% endblock %}

{% block conteudo %}
    <h1 class="mb-3">Dados da Área</h1>

    <div class="card mb-3">
        <div class="card-body">
            <p><strong>Nome:</strong> {{ area.nome }}</p>
            <p><strong>Descrição:</strong> {{ area.descricao|default:"-" }}</p>
            <p><strong>Ativa:</strong> {% if area.ativa %}Sim{% else %}Não{% endif %}</p>
        </div>
    </div>

    <a href="{% url 'curso:atualiza_area' area.id %}" class="btn btn-warning">Atualizar</a>
    <a href="{% url 'curso:exclui_area' area.id %}" class="btn btn-danger">Excluir</a>
    <a href="{% url 'curso:lista_area' %}" class="btn btn-secondary">Voltar</a>
{% endblock %}
